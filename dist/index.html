          document.documentElement.dataset.motion = m;
          if (['aurora', 'garden', 'chalk'].indexOf(t) !== -1) {
            document.documentElement.style.colorScheme = 'dark';
          }
          var fav = document.querySelector("link[rel*='icon']");
          if (fav) {

        } catch(e) {}
      })();
