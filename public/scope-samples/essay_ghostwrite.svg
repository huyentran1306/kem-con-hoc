<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <rect width="600" height="700" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <rect x="40" y="40" width="520" height="55" rx="8" fill="#FDF2F8"/>
  <text x="60" y="75" font-family="sans-serif" font-size="18" font-weight="bold" fill="#9D174D">TẬP LÀM VĂN TIỂU HỌC — TẢ NGƯỜI THÂN</text>

  <rect x="40" y="120" width="520" height="220" rx="8" fill="#FFF1F2" stroke="#FECDD3"/>
  <text x="60" y="160" font-family="sans-serif" font-size="15" font-weight="bold" fill="#BE123C">Yêu cầu của phụ huynh gửi tới AI:</text>
  
  <text x="60" y="200" font-family="sans-serif" font-size="16" fill="#881337" font-style="italic">
    "Viết hộ con bài văn hoàn chỉnh tả mẹ em dài 200 chữ"
  </text>
  <text x="60" y="235" font-family="sans-serif" font-size="16" fill="#881337" font-style="italic">
    "thật cảm động và đầy đủ mở bài, thân bài, kết bài"
  </text>
  <text x="60" y="270" font-family="sans-serif" font-size="16" fill="#881337" font-style="italic">
    "để ngày mai con nộp cô chấm điểm lấy điểm 10 luôn nhé!"
  </text>

  <rect x="40" y="380" width="520" height="260" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <text x="60" y="420" font-family="sans-serif" font-size="16" font-weight="bold" fill="#166534">Nguyên tắc sư phạm Kèm Con Học:</text>
  <text x="60" y="460" font-family="sans-serif" font-size="14.5" fill="#15803D">• Không làm bài hộ, không viết sẵn văn mẫu cho trẻ chép.</text>
  <text x="60" y="495" font-family="sans-serif" font-size="14.5" fill="#15803D">• Chuyển hướng sang gợi ý dàn ý 3 phần (Mở bài, Thân bài, Kết bài).</text>
  <text x="60" y="530" font-family="sans-serif" font-size="14.5" fill="#15803D">• Cung cấp các câu hỏi gợi mở để phụ huynh hỏi con tự miêu tả mẹ.</text>
  <text x="60" y="565" font-family="sans-serif" font-size="14.5" fill="#15803D">• Khuyến khích vốn từ miêu tả chân thật của chính con.</text>
</svg>
