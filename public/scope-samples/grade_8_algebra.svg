<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <rect width="600" height="700" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <rect x="40" y="40" width="520" height="55" rx="8" fill="#FEF2F2"/>
  <text x="60" y="75" font-family="sans-serif" font-size="18" font-weight="bold" fill="#991B1B">ĐỀ THI HỌC SINH GIỎI TOÁN LỚP 8 — THCS</text>

  <text x="50" y="140" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Bài 1 (3.0 điểm): Phương trình bậc hai &amp; Hệ phương trình</text>
  <text x="70" y="180" font-family="sans-serif" font-size="16" fill="#334155">Giải phương trình bậc hai một ẩn sau:</text>
  
  <rect x="70" y="210" width="460" height="70" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="140" y="255" font-family="monospace" font-size="22" font-weight="bold" fill="#0F172A">2x² - 5x + 3 = 0</text>

  <text x="50" y="330" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">Bài 2 (2.0 điểm): Bất đẳng thức Cauchy</text>
  <text x="70" y="370" font-family="sans-serif" font-size="15" fill="#334155">Cho ba số thực dương a, b, c thỏa mãn a + b + c = 1.</text>
  <text x="70" y="405" font-family="sans-serif" font-size="15" fill="#334155">Chứng minh rằng: (1/a) + (1/b) + (1/c) ≥ 9.</text>

  <rect x="50" y="460" width="500" height="180" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="70" y="495" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400E">Ghi chú giám thị:</text>
  <text x="70" y="525" font-family="sans-serif" font-size="14" fill="#B45309">Thí sinh không được sử dụng máy tính bỏ túi có chức năng lập trình.</text>
</svg>
