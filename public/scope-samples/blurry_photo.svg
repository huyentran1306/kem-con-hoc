<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <filter id="gaussianBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Background Paper with blur -->
  <rect width="600" height="800" fill="#E2E8F0"/>
  
  <g filter="url(#gaussianBlur)">
    <rect x="50" y="50" width="500" height="700" fill="#FFFFFF" transform="rotate(-3 300 400)"/>
    <rect x="80" y="100" width="300" height="30" fill="#94A3B8"/>
    <rect x="80" y="160" width="440" height="15" fill="#CBD5E1"/>
    <rect x="80" y="190" width="400" height="15" fill="#CBD5E1"/>
    <rect x="80" y="240" width="200" height="25" fill="#94A3B8"/>
    <rect x="80" y="290" width="440" height="15" fill="#CBD5E1"/>
    <rect x="80" y="320" width="360" height="15" fill="#CBD5E1"/>
    <rect x="80" y="370" width="250" height="25" fill="#94A3B8"/>
    <rect x="80" y="420" width="420" height="15" fill="#CBD5E1"/>
    <!-- Simulated flash glare -->
    <circle cx="420" cy="220" r="140" fill="#FFFFFF" opacity="0.6"/>
  </g>
  <text x="300" y="760" font-family="sans-serif" font-size="16" fill="#64748B" text-anchor="middle" font-weight="bold">
    [Ảnh mô phỏng chụp mờ và lóa đèn flash]
  </text>
</svg>
