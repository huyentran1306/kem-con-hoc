<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <rect width="600" height="800" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Header -->
  <text x="300" y="55" font-family="sans-serif" font-size="19" font-weight="bold" fill="#0F172A" text-anchor="middle">PHIẾU ÔN TẬP TOÁN CUỐI HỌC KỲ</text>
  <line x1="40" y1="80" x2="560" y2="80" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Exercise 1 Box -->
  <rect x="40" y="105" width="520" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="55" y="120" width="80" height="26" rx="4" fill="#0284C7"/>
  <text x="95" y="138" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CÂU 1</text>
  <text x="145" y="139" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1E293B">Đặt tính rồi tính:</text>
  <text x="65" y="180" font-family="sans-serif" font-size="15" fill="#334155">a) 245 + 138                              b) 682 - 247</text>
  <text x="65" y="230" font-family="sans-serif" font-size="15" fill="#334155">c) 34 × 5                                   d) 84 : 4</text>

  <!-- Exercise 2 Box -->
  <rect x="40" y="310" width="520" height="180" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="55" y="325" width="80" height="26" rx="4" fill="#0284C7"/>
  <text x="95" y="343" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CÂU 2</text>
  <text x="145" y="344" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1E293B">Tìm x biết:</text>
  <text x="65" y="385" font-family="sans-serif" font-size="15" fill="#334155">a) x - 45 = 120                           b) x : 4 = 18</text>
  <text x="65" y="435" font-family="sans-serif" font-size="15" fill="#334155">c) 250 - x = 85                           d) x × 6 = 72</text>

  <!-- Exercise 3 Box -->
  <rect x="40" y="515" width="520" height="240" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="55" y="530" width="80" height="26" rx="4" fill="#0284C7"/>
  <text x="95" y="548" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CÂU 3</text>
  <text x="145" y="549" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1E293B">Giải bài toán hình học:</text>
  <text x="65" y="590" font-family="sans-serif" font-size="15" fill="#334155">Một mảnh vườn hình chữ nhật có chiều dài 15 m,</text>
  <text x="65" y="620" font-family="sans-serif" font-size="15" fill="#334155">chiều rộng 8 m. Người ta dùng 1/4 diện tích mảnh vườn</text>
  <text x="65" y="650" font-family="sans-serif" font-size="15" fill="#334155">để trồng rau.</text>
  <text x="65" y="685" font-family="sans-serif" font-size="15" font-weight="bold" fill="#0F172A">Tính diện tích phần đất trồng rau đó?</text>
</svg>
