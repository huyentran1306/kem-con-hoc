<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="50%" stop-color="#FFF1F2"/>
      <stop offset="100%" stop-color="#FCE7F3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#BE185D" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background App Tile -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#F43F5E" stroke-width="6" stroke-opacity="0.12"/>
  
  <!-- Flower Emblem -->
  <g transform="translate(256, 230)" filter="url(#shadow)">
    <text text-anchor="middle" dominant-baseline="central" font-size="220" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🌸</text>
  </g>
  
  <!-- App Title Pill -->
  <rect x="96" y="380" width="320" height="68" rx="34" fill="#BE185D"/>
  <text x="256" y="423" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" letter-spacing="1">KÈM CON HỌC</text>
</svg>
